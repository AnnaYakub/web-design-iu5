<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{TITLE}} — Издательство АСТ</title>
    <link rel="stylesheet" href="/laba1.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <img src="/logo.jpg" alt="Логотип АСТ" class="header__logo">
            <nav class="menu">
                <ul>
                    <li><a href="/opening.html">Домой</a></li>
                    <li><a href="/laba1.html">Калькулятор</a></li>
                    <li><a href="https://github.com/AnnaYakub/web-design-iu5">Репозиторий</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="catalog-section" style="margin-top:120px;">
        <div class="catalog-header">
            <h2>{{TITLE}}</h2>
            <p class="catalog-subtitle">Издательская группа «АСТ»</p>
        </div>

        <div class="catalog-product" style="display:block;">
            <div class="product-card-wrap">
                <div class="row g-0">
                    <div class="col-md-4">
                        <div class="product-cover" style="background: {{COVER}};">
                            {{TITLE}}
                        </div>
                    </div>
                    <div class="col-md-8">
                        <div class="card-body">
                            <h3 class="card-title" style="color:#1e8449;">{{TITLE}}</h3>
                            <p class="card-text">{{TEXT}}</p>
                            <div class="book-meta" style="justify-content:flex-start; gap:10px;">
                                <span class="book-genre">{{GENRE}}</span>
                                <span class="book-age">{{AGE}}</span>
                            </div>
                            <div class="book-price" style="text-align:left; border:none; padding-top:0;">
                                {{PRICE}} ₽
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="final">
        <p>@Лабораторные работы "Издательство АСТ" — Якубович Анна Ильинична ИБМ3-54Б</p>
    </div>
</body>
</html>
